[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illiad-fieldlines"
dynamic = ["version"]
description = "Illinois Lagrangian Impurity Advection and Deposition modeling tools for HIDRA field-line and impurity-ion transport analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "ILLIAD contributors" },
]
keywords = [
    "plasma-physics",
    "stellarator",
    "field-lines",
    "particle-tracing",
    "hidra",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
    "torch",
    "Pillow",
    "torchrbf",
]

[project.optional-dependencies]
fitting = [
    "scikit-learn",
]
viewer = [
    "fastplotlib",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
]
export = [
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "build",
]
all = [
    "scikit-learn",
    "fastplotlib",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
    "imageio",
    "imageio-ffmpeg",
    "build",
]

[project.urls]
Homepage = "https://github.com/lcpp-org/fieldlines-uiuc"
Repository = "https://github.com/lcpp-org/fieldlines-uiuc"

[project.scripts]
illiad-fieldsolver = "runFieldsolver:main"
illiad-poincare = "runPoincare:main"
illiad-flux-calc = "runFluxCalc:main"
illiad-flux-grad = "runFluxGrad:main"
illiad-boris = "runBoris_new:main"

[dependency-groups]
fitting = [
    "scikit-learn",
]
viewer = [
    "fastplotlib",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
]
export = [
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "build",
]

[tool.setuptools.dynamic]
version = { attr = "illiad.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "illiad",
    "classes",
    "utility",
    "plot_funcs",
    "fastplotlib_tests",
]
exclude = [
    "input_files",
    "misc_runFiles",
    "output",
]

[tool.setuptools]
include-package-data = false
py-modules = [
    "runBoris_new",
    "runFieldsolver",
    "runFluxCalc",
    "runFluxGrad",
    "runPoincare",
]
