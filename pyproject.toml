[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "illiad-fieldlines"
dynamic = ["version"]
description = "Illinois Lagrangian Ion Advection and Deposition modeling tools for HIDRA field-line and impurity-ion transport analysis."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "ILLIAD contributors" },
]
keywords = [
    "plasma-physics",
    "stellarator",
    "field-lines",
    "particle-tracing",
    "hidra",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "tqdm",
    "torch",
    "Pillow",
    "torchrbf",
]

[project.optional-dependencies]
fitting = [
    "scikit-learn",
]
viewer = [
    "fastplotlib",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
]
export = [
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "build",
]
all = [
    "scikit-learn",
    "fastplotlib",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
    "imageio",
    "imageio-ffmpeg",
    "build",
]

[project.urls]
Homepage = "https://github.com/lcpp-org/illiad"
Repository = "https://github.com/lcpp-org/illiad"

[project.scripts]
illiad-fieldsolver = "illiad.cli.fieldsolver:main"
illiad-poincare = "illiad.cli.poincare:main"
illiad-flux-calc = "illiad.cli.flux_calc:main"
illiad-flux-grad = "illiad.cli.flux_grad:main"
illiad-sol-trace = "illiad.cli.sol_trace:main"
illiad-sol-regularize = "illiad.cli.sol_regularize:main"
illiad-sol-density = "illiad.cli.sol_density:main"
illiad-sol-potential = "illiad.cli.sol_potential:main"
illiad-boris = "illiad.cli.boris:main"

[dependency-groups]
fitting = [
    "scikit-learn",
]
viewer = [
    "fastplotlib",
    "pygfx",
    "wgpu",
    "rendercanvas",
    "PySide6",
]
export = [
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "build",
]

[tool.setuptools.dynamic]
version = { attr = "illiad.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = [
    "illiad*",
    "fastplotlib_tests",
]
exclude = [
    "input_files",
    "misc_runFiles",
    "output",
]

[tool.setuptools]
include-package-data = false
